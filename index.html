<!-- Define que este archivo es un documento moderno de HTML5 -->
<!DOCTYPE html>
<!-- Etiqueta raíz de toda la página web; lang="es" indica que el contenido está en español -->
<html lang="es">
<!-- Sección <head>: contiene la configuración invisible de la página (título, estilos, librerías, iconos) -->
<head>
  <!-- Define la codificación de caracteres UTF-8 para que se vean bien las tildes (á, é, í, ó, ú) y la letra ñ -->
  <meta charset="UTF-8">
  <!-- Configura la vista en celulares y tablets para que ocupe el ancho real de la pantalla y bloquea el zoom manual -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Título que aparece en la pestaña del navegador -->
  <title>Tablero 7 EGB - Participación y Bitácora</title>
  
  <!-- Permite que, al agregar la web a la pantalla de inicio en Android, se abra como aplicación sin barra de navegador -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Pinta de color azul muy oscuro (#0f172a) la barra superior de notificaciones del celular -->
  <meta name="theme-color" content="#0f172a">
  <!-- Vincula el archivo manifest.json necesario para instalar la página como Aplicación Web Progresiva (PWA) -->
  <link rel="manifest" href="manifest.json">
  <!-- Permite abrir la página en pantalla completa en dispositivos Apple (iPhone/iPad) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Hace que la barra superior de estado en iPhone sea oscura y translúcida -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Nombre corto que aparecerá debajo del ícono si se guarda en la pantalla de inicio de un iPhone/iPad -->
  <meta name="apple-mobile-web-app-title" content="Tablero 7 EGB">

  <!-- Carga desde internet la librería externa jsPDF, que permite fabricar y descargar archivos PDF directamente desde el navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Inicio de la sección <style>: aquí se definen todos los colores, tamaños, posiciones y animaciones (CSS) -->

    * { box-sizing: border-box; }

    /* Estilos generales para el documento y el cuerpo visible de la página */
    html, body {
      margin: 0; /* Quita los márgenes blancos por defecto del navegador */

      width: 100vw; /* Ocupa el 100% del ancho de la ventana (Viewport Width) */
      height: 100dvh; /* Ocupa el 100% del alto dinámico de la pantalla (Dynamic Viewport Height, ideal para móviles) */
      overflow: hidden; /* Evita que aparezcan barras de desplazamiento (scroll) en toda la pantalla */
      background-color: #0f172a; /* Color de fondo principal: azul pizarra muy oscuro */

      flex-direction: column; /* Apila los elementos principales en columna de arriba hacia abajo (Header -> Cuadrícula -> Footer) */
    }

    h1 {

      font-size: 16px; /* Tamaño de letra de 16 píxeles */
      letter-spacing: 1px; /* Separa ligeramente las letras entre sí para mayor legibilidad */
    }

      color: #94a3b8; /* Color gris azulado suave */
    }
